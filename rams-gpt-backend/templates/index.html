<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Tools Dashboard – RAMS Generator</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #222;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 24px;
      color: #555;
    }

    .start-button {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1em;
      background-color: #007acc;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }

    .start-button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>AI RAMS Generator</h1>
    <p>Use our AI-powered system to create site-specific Risk Assessments and Method Statements. Click below to begin.</p>
    <a href="/rams" class="start-button">Launch RAMS Generator</a>
  </main>
</body>
</html>
