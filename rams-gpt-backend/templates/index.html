<!DOCTYPE html>

<body>
  <h1>RAMS Generator</h1>
  <p>Provide the following details to generate a Risk Assessment Method Statement:</p>
  <form action="/rams_chat" method="post">

    <label for="answer2">Answer 2:</label><br />
    <input type="text" id="answer2" name="answer2" required /><br /><br />

    <label for="answer3">Answer 3:</label><br />
    <input type="text" id="answer3" name="answer3" required /><br /><br />

    <label for="answer4">Answer 4:</label><br />
    <input type="text" id="answer4" name="answer4" /><br /><br />

    <label for="answer5">Answer 5:</label><br />
    <input type="text" id="answer5" name="answer5" /><br /><br />

    <label for="answer6">Answer 6:</label><br />
    <input type="text" id="answer6" name="answer6" /><br /><br />

    <label for="answer7">Answer 7:</label><br />
    <input type="text" id="answer7" name="answer7" /><br /><br />

    <button type="submit">Submit</button>
  </form>

  <p>Or you can <a href="/rams_chat">go to the chat interface</a> to interactively generate the RAMS.</p>
</body>
</html>
