<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI RAMS Generator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat-container {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      max-height: 400px;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      overflow-y: auto;
    }
    .message {
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      white-space: pre-wrap;
      max-width: 80%;
    }
    .assistant.message {
      background-color: #cfe2ff;
      align-self: flex-start;
    }
    .user.message {
      background-color: #e9ecef;
      align-self: flex-end;
    }
    #chat-form { display: flex; max-width: 600px; }
    #message-input { flex: 1; padding: 8px; }
    #chat-form button { padding: 8px 20px; }
    .download-link {
      display: block;
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>AI RAMS Generator</h1>

  <div id="chat-container">
    {% for msg in messages %}
    <div class="{{ 'assistant' if msg.role == 'assistant' else 'user' }} message">
      {{ msg.content }}
    </div>
    {% endfor %}
  </div>

  <form id="chat-form">
    <input type="text" id="message-input" placeholder="Type your task or answer..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script src="/static/script.js"></script>
</body>
</html>
