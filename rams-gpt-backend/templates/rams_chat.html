<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAMS Generator Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #4CAF50;
            color: #fff;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        #chat {
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            max-width: 800px;
            margin: 0 auto;
            margin-top: 10px;
            margin-bottom: 60px; /* space at bottom for input bar */
            overflow-y: auto;
        }
        .message {
            max-width: 80%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .bot-message {
            background-color: #f1f1f1;
            align-self: flex-start;
        }
        .user-message {
            background-color: #d4f5d4;
            align-self: flex-end;
        }
        #input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            display: flex;
            border-top: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
        }
        #user-input {
            flex: 1;
            font-size: 1em;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #send-btn {
            font-size: 1em;
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            background-color: #4CAF50;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        #send-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>AI RAMS Generator</h1>
    <div id="chat">
        <!-- Initial prompt from the bot -->
        <div class="message bot-message">Please describe the task you'd like a RAMS for. Include as much detail as possible.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your answer here..." autocomplete="off" />
        <button id="send-btn">Send</button>
    </div>
    <!-- Hidden field to store session ID -->
    <input type="hidden" id="session-id" value="{{ session_id }}" />
    <script>
        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const chatDiv = document.getElementById('chat');
        const sessionId = document.getElementById('session-id').value;
        let currentQuestionNumber = 0;

        // Send message on button click or Enter key press
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) {
                return;
            }
            // Display user's message
            addMessage(text, 'user');
            userInput.value = '';  // clear input field

            const isInitial = (currentQuestionNumber === 0);
            // Show a loading message from the bot
            const loadingText = isInitial ? 'Generating tailored questions...' : '...';
            const loadingElem = addMessage(loadingText, 'bot');

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: text })
                });
                if (!response.ok) {
                    // Parse error message if available
                    let errData;
                    try {
                        errData = await response.json();
                    } catch {}
                    const errMsg = errData && errData.error ? errData.error : `Request failed with status ${response.status}`;
                    throw new Error(errMsg);
                }
                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                if (data.question) {
                    // Got the next question
                    currentQuestionNumber += 1;
                    loadingElem.innerText = currentQuestionNumber + '. ' + data.question;
                } else if (data.done) {
                    // All questions answered, generating document
                    loadingElem.innerText = 'Generating document...';
                    // Trigger download of the Word document
                    window.location.href = '/download?session_id=' + encodeURIComponent(sessionId);
                    // Optionally, inform the user in chat that download started
                    addMessage('Your RAMS document is being downloaded.', 'bot');
                }
            } catch (err) {
                console.error(err);
                loadingElem.innerText = 'Error: ' + err.message;
            }
        }

        // Helper to add a message to the chat window
        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (sender === 'user' ? 'user-message' : 'bot-message');
            msgDiv.innerText = text;
            chatDiv.appendChild(msgDiv);
            // Auto-scroll to bottom
            chatDiv.scrollTop = chatDiv.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
