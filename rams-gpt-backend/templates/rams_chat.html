<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI RAMS Generator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>AI RAMS Generator</h1>

    <div id="chat">
      <div class="message ai">Please describe the task you'd like a RAMS for. Include as much detail as possible.</div>
    </div>

    <form id="input-form">
      <textarea id="user-input" placeholder="Type your task or answer..." rows="2"></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    let sessionId = null;
    let currentQuestionIndex = 0;
    let questions = [];

    const form = document.getElementById('input-form');
    const input = document.getElementById('user-input');
    const chat = document.getElementById('chat');

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = 'message ' + sender;
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      addMessage(value, 'user');
      input.value = '';

      // If no session, this is the task
      if (!sessionId) {
        addMessage("🔄 Generating tailored questions...", "ai");
        const res = await fetch('/rams_chat/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ task: value })
        });
        const data = await res.json();
        sessionId = data.session_id;
        questions = data.questions;
        currentQuestionIndex = 0;
        addMessage(`1. ${questions[0]}`, 'ai');
        return;
      }

      // Send answer
      const res = await fetch('/rams_chat/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, answer: value })
      });
      const data = await res.json();

      if (data.complete) {
        addMessage("⚙️ Generating your RAMS document...", 'ai');
        const finalRes = await fetch('/rams_chat/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
        const blob = await finalRes.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "RAMS_Document.docx";
        a.click();
        window.URL.revokeObjectURL(url);
        addMessage("✅ RAMS document ready and downloaded.", 'ai');
        form.style.display = 'none';
      } else {
        currentQuestionIndex++;
        addMessage(`${currentQuestionIndex + 1}. ${data.next_question}`, 'ai');
      }
    });
  </script>
</body>
</html>
